<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EMCO Spec Builder Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f7fb;
color:#1f2937;
}

header{
background:#0f172a;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header span{
color:#3b82f6;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.card h2{
font-size:34px;
color:#2563eb;
margin-bottom:10px;
}

.upload{
background:white;
padding:40px;
border:3px dashed #3b82f6;
border-radius:15px;
text-align:center;
margin-bottom:30px;
}

.upload h2{
margin-bottom:10px;
}

.upload p{
color:#64748b;
margin-bottom:15px;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
}

.form{
display:grid;
grid-template-columns:1fr 1fr 1fr auto;
gap:15px;
}

input,select{
padding:12px;
border:1px solid #cbd5e1;
border-radius:10px;
width:100%;
}

button{
background:#2563eb;
color:white;
border:none;
border-radius:10px;
padding:12px 20px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.generate{
width:100%;
padding:18px;
font-size:18px;
font-weight:bold;
background:#0f172a;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#2563eb;
color:white;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #e5e7eb;
}

.status{
background:#dcfce7;
color:#166534;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.manual{
background:#fef3c7;
color:#92400e;
}

@media(max-width:900px){

.form{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>
<h1>EMCO <span>Spec Builder Pro</span></h1>
<div>Specification Book Generator</div>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>18</h2>
<div>Manufacturers</div>
</div>

<div class="card">
<h2>125</h2>
<div>Products Indexed</div>
</div>

<div class="card">
<h2>97%</h2>
<div>Recognition Rate</div>
</div>

<div class="card">
<h2>8</h2>
<div>Spec Books Today</div>
</div>

</div>

<div class="upload">

<h2>Upload Quote PDF</h2>

<p>
Upload a quotation PDF to detect products automatically
</p>

<input type="file">

</div>

<div class="section">

<h2>Detected Products</h2>

<table>

<thead>
<tr>
<th>Brand</th>
<th>Model</th>
<th>Status</th>
</tr>
</thead>

<tbody id="products">

<tr>
<td>Delta</td>
<td>T17238</td>
<td>
<span class="status">
Found
</span>
</td>
</tr>

</tbody>

</table>

</div>

<div class="section">

<h2>Add Product Manually</h2>

<div class="form">

<select id="brand" onchange="toggleCustomBrand()">

<option value="Delta">Delta</option>
<option value="Riobel">Riobel</option>
<option value="Brizo">Brizo</option>
<option value="Moen">Moen</option>
<option value="Kohler">Kohler</option>
<option value="Grohe">Grohe</option>
<option value="Hansgrohe">Hansgrohe</option>
<option value="Toto">Toto</option>
<option value="Blanco">Blanco</option>
<option value="Franke">Franke</option>

<option value="CUSTOM">
Other Brand...
</option>

</select>

<input
id="customBrand"
placeholder="Custom Brand Name"
style="display:none;">

<input
id="model"
placeholder="Model Number">

<button onclick="addProduct()">
Add Product
</button>

</div>

</div>

<button
class="generate"
onclick="generateSpecBook()">

Generate Spec Book

</button>

</div>

<script>

function toggleCustomBrand(){

let value =
document.getElementById("brand").value;

let custom =
document.getElementById("customBrand");

if(value==="CUSTOM"){

custom.style.display="block";

}else{

custom.style.display="none";

}

}

function addProduct(){

let brand =
document.getElementById("brand").value;

if(brand==="CUSTOM"){

brand =
document.getElementById("customBrand")
.value
.trim();

}

let model =
document.getElementById("model")
.value
.trim();

if(brand===""){

alert("Enter a brand");
return;

}

if(model===""){

alert("Enter a model number");
return;

}

let row=`

<tr>

<td>${brand}</td>

<td>${model}</td>

<td>
<span class="status manual">
Manual Entry
</span>
</td>

</tr>

`;

document
.getElementById("products")
.insertAdjacentHTML("beforeend",row);

document.getElementById("model").value="";
document.getElementById("customBrand").value="";

}

function generateSpecBook(){

alert(
"Spec Book generation will be connected in Version 2."
);

}

</script>

</body>
</html>
